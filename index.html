<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            line-height: 1.5;
            min-height: 100vh;
        }
        
        .container {
            max-width: 56rem;
            margin: 0 auto;
            padding: 1.5rem;
        }
        
        .title-text {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #00f5ff 0%, #7b2ff7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.75rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1rem;
            font-family: 'Space Grotesk', sans-serif;
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #00f5ff 0%, #7b2ff7 100%);
            color: #0f0f23;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(0, 245, 255, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 245, 255, 0.5);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 245, 255, 0.2);
            color: #e0e0e0;
        }
        
        .btn-secondary:hover {
            background: rgba(0, 245, 255, 0.1);
            border-color: rgba(0, 245, 255, 0.4);
            transform: translateY(-1px);
        }
        
        .workout-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 245, 255, 0.15);
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        
        .workout-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #00f5ff, #7b2ff7);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .workout-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 245, 255, 0.2);
            border-color: rgba(0, 245, 255, 0.4);
        }
        
        .workout-card:hover::before {
            opacity: 1;
        }
        
        .exercise-box {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 245, 255, 0.1);
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 0.75rem;
            overflow: visible;
        }
        
        input, textarea {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 245, 255, 0.2);
            border-radius: 0.5rem;
            font-size: 1rem;
            color: #e0e0e0;
            font-family: 'Space Grotesk', sans-serif;
            transition: all 0.3s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #00f5ff;
            background: rgba(0, 245, 255, 0.05);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.2);
        }
        
        input::placeholder, textarea::placeholder {
            color: rgba(224, 224, 224, 0.4);
        }
        
        .timer {
            border: 3px solid #00f5ff;
            border-radius: 50%;
            width: 5rem;
            height: 5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 700;
            color: #00f5ff;
            background: rgba(0, 245, 255, 0.05);
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.3);
        }
        
        .color-dot {
            width: 1rem;
            height: 1rem;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        
        .hidden {
            display: none !important;
        }
        
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
        }
        
        .auth-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(0, 245, 255, 0.1);
            border: 1px solid rgba(0, 245, 255, 0.2);
            width: 90%;
            max-width: 400px;
        }
        
        .flex { display: flex; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mt-4 { margin-top: 1rem; }
        .text-center { text-align: center; }
        .text-sm { font-size: 0.875rem; }
        .text-xs { font-size: 0.75rem; }
        .text-gray { color: rgba(224, 224, 224, 0.6); }
        .font-bold { font-weight: 700; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        
        .error {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
        }
        
        .spinner {
            border: 3px solid rgba(0, 245, 255, 0.1);
            border-top: 3px solid #00f5ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .neon-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f5ff, #7b2ff7, transparent);
            margin: 1rem 0;
            box-shadow: 0 0 10px rgba(0, 245, 255, 0.5);
        }

        /* Library dropdown styles */
        .library-dropdown {
            position: fixed !important;
            background: rgba(15, 15, 35, 0.98) !important;
            border: 1px solid rgba(0, 245, 255, 0.3);
            border-radius: 0.75rem;
            z-index: 99999 !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 245, 255, 0.1);
            overflow: hidden;
        }

        .library-tag-group {
            border-bottom: 1px solid rgba(0, 245, 255, 0.1);
        }

        .library-tag-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.625rem 0.875rem;
            cursor: pointer;
            background: rgba(0, 245, 255, 0.05);
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(0, 245, 255, 0.8);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        .library-tag-header:hover {
            background: rgba(0, 245, 255, 0.1);
        }

        .library-tag-exercises {
            padding: 0.375rem 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.125rem;
        }

        .library-exercise-item {
            padding: 0.5rem 0.625rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
            color: rgba(224, 224, 224, 0.85);
            transition: all 0.15s;
        }

        .library-exercise-item:hover {
            background: rgba(0, 245, 255, 0.12);
            color: #00f5ff;
        }

        /* Autocomplete dropdown */
        .autocomplete-dropdown {
            position: fixed !important;
            background: rgba(15, 15, 35, 0.98) !important;
            border: 1px solid rgba(0, 245, 255, 0.3);
            border-radius: 0.5rem;
            z-index: 99999 !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            max-height: 220px;
            overflow-y: auto;
        }

        /* Fix exercise-box overflow for dropdowns inside */
        .exercise-box.add-exercise-box {
            overflow: visible;
            position: relative;
            z-index: 10;
        }

        /* Per-exercise dropdowns */
        .exercise-dropdown-portal {
            position: fixed !important;
            background: rgba(15, 15, 35, 0.98);
            border: 1px solid rgba(0, 245, 255, 0.3);
            border-radius: 0.5rem;
            z-index: 99999 !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            padding: 0.75rem;
            min-width: 220px;
        }
    </style>
</head>
<body>
    <!-- Auth Screen -->
    <div id="authScreen" class="auth-container">
        <div class="auth-box">
            <h1 class="title-text text-center mb-4" style="font-size: 2rem;">Workout Tracker</h1>
            
            <div id="authError" class="error hidden"></div>
            
            <div id="loginForm">

                    <span style="padding: 0 1rem; color: rgba(224, 224, 224, 0.6); font-size: 0.875rem;">or</span>
                    <div style="flex: 1; height: 1px; background: rgba(255, 255, 255, 0.2);"></div>
                </div>
                <button class="btn btn-secondary" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.75rem;" id="googleLoginBtn">

                <p class="text-center text-sm text-gray mt-4">

                </p>
            </div>
            
            <div id="signupForm" class="hidden">
                <div class="mb-4">
                    <label class="text-sm font-bold mb-2" style="display: block;">Email</label>
                    <input type="email" id="signupEmail" placeholder="your@email.com">
                </div>
                <div class="mb-4">
                    <label class="text-sm font-bold mb-2" style="display: block;">Password</label>
                    <input type="password" id="signupPassword" placeholder="••••••••">
                </div>
                <div class="mb-4">
                    <label class="text-sm font-bold mb-2" style="display: block;">Confirm Password</label>
                    <input type="password" id="signupPasswordConfirm" placeholder="••••••••">
                </div>
                <button class="btn btn-primary" style="width: 100%;" id="signupBtn">Sign Up</button>
                <div style="display: flex; align-items: center; margin: 1.5rem 0;">
                    <div style="flex: 1; height: 1px; background: rgba(255, 255, 255, 0.2);"></div>
                    <span style="padding: 0 1rem; color: rgba(224, 224, 224, 0.6); font-size: 0.875rem;">or</span>
                    <div style="flex: 1; height: 1px; background: rgba(255, 255, 255, 0.2);"></div>
                </div>
                <button class="btn btn-secondary" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.75rem;" id="googleSignupBtn">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/><path d="M9.003 18c2.43 0 4.467-.806 5.956-2.184l-2.909-2.258c-.806.54-1.836.86-3.047.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9.003 18z" fill="#34A853"/><path d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71 0-.593.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9.003 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.464.891 11.426 0 9.003 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29c.708-2.127 2.692-3.71 5.039-3.71z" fill="#EA4335"/></svg>
                    Continue with Google
                </button>
                <p class="text-center text-sm text-gray mt-4">
                    Already have an account? <a href="#" id="showLoginLink" style="color: #3b82f6;">Log in</a>
                </p>
            </div>
        </div>
    </div>
    
    <!-- Loading Screen -->
    <div id="loadingScreen" class="hidden">
        <div class="loading">
            <div class="spinner"></div>
            <p class="text-gray mt-4">Loading...</p>
        </div>
    </div>
    
    <!-- Home Screen -->
    <div id="homeScreen" class="container hidden">
        <div class="mb-4 flex" style="justify-content: space-between; align-items: center;">
            <h1 class="title-text" style="font-size: 2rem;">Workout Tracker</h1>
            <div class="flex gap-2">
                <button class="btn btn-secondary" id="settingsBtn" style="padding: 0.5rem 0.75rem;">⚙️</button>
                <button class="btn btn-secondary" id="historyBtn">Activity</button>
            </div>
        </div>
        <h2 class="title-text mb-2" style="font-size: 1.25rem; color: rgba(0, 245, 255, 0.7);">Start Workout:</h2>
        <div id="workoutCategories"></div>
    </div>
    
    <!-- Workout Screen -->
    <div id="workoutScreen" class="container hidden">
        <div class="mb-4 flex" style="justify-content: space-between; align-items: center;">
            <button class="btn btn-secondary" id="backFromWorkoutBtn">← Back</button>
            <div class="flex gap-2">
                <button class="btn btn-secondary" id="workoutHistoryBtn">Activity</button>
                <button class="btn btn-secondary" id="workoutSettingsBtn">⚙️</button>
            </div>
        </div>
        
        <div class="mb-4 flex" style="justify-content: space-between; align-items: flex-start;">
            <div>
                <div class="flex gap-2 mb-2" style="align-items: center;">
                    <span class="color-dot" id="workoutColorDot"></span>
                    <h1 class="title-text" style="font-size: 2rem;" id="workoutTitle"></h1>
                </div>
                <div class="flex gap-2" style="align-items: center; margin-top: 0.5rem;">
                    <input type="date" id="workoutDate" style="padding: 0.25rem 0.5rem; border: 1px solid #cbd5e1; border-radius: 0.25rem; font-size: 0.875rem;">
                    <input type="time" id="workoutTime" style="padding: 0.25rem 0.5rem; border: 1px solid #cbd5e1; border-radius: 0.25rem; font-size: 0.875rem;">
                </div>
                <p class="text-sm text-gray mt-2" id="workoutInfo"></p>
            </div>
            <div style="text-align: center;">
                <div class="timer" id="timerDisplay" style="cursor: pointer;" title="Click to start/pause">1:30</div>
                <div class="flex gap-2" style="margin-top: 0.5rem; justify-content: center;">
                    <button class="btn btn-secondary" style="padding: 0.5rem;" id="resetTimerBtn">↻</button>
                </div>
            </div>
        </div>
        
        <div id="previousWorkouts" class="mb-4"></div>
        <div id="exerciseList"></div>
        
        <!-- Add Exercise Box -->
        <div class="exercise-box add-exercise-box mb-4">
            <div class="mb-2">
                <label class="text-sm font-bold">Add Exercise</label>
                <div style="margin-top: 0.5rem; position: relative;">
                    <input type="text" id="customExercise" name="exercise-name-input" placeholder="Type to search or browse library..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
                    <!-- Autocomplete dropdown - positioned via JS -->
                    <div id="exerciseAutocomplete" class="autocomplete-dropdown hidden"></div>
                </div>
                <div class="flex gap-2" style="margin-top: 0.5rem;">
                    <button class="btn btn-primary" id="addExerciseBtn" style="flex: 1;">Add Exercise</button>
                    <div style="position: relative; flex: 1;">
                        <button class="btn btn-secondary" id="libraryBtn" style="width: 100%;">Library ▼</button>
                        <!-- Library dropdown - positioned via JS as fixed -->
                        <div id="libraryDropdown" class="library-dropdown hidden"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="exercise-box mb-4">
            <label class="text-sm font-bold mb-2" style="display: block;">Workout Notes</label>
            <textarea id="workoutNotes" rows="3" placeholder="How did you feel? Any observations..."></textarea>
        </div>
        
        <div class="flex gap-4">
            <button class="btn btn-secondary" style="flex: 1;" id="cancelWorkoutBtn">Cancel</button>
            <button class="btn btn-primary" style="flex: 1;" id="finishWorkoutBtn">Finish</button>
        </div>
    </div>
    
    <!-- History Screen -->
    <div id="historyScreen" class="container hidden">
        <div class="mb-4 flex" style="justify-content: space-between; align-items: center;">
            <h1 class="title-text" style="font-size: 2rem;">Activity</h1>
            <button class="btn btn-secondary" id="backFromHistoryBtn">Back</button>
        </div>
        <div id="historyContent"></div>
    </div>
    
    <!-- Settings Screen -->
    <div id="settingsScreen" class="container hidden">
        <div class="mb-4 flex" style="justify-content: space-between; align-items: center;">
            <h1 class="title-text" style="font-size: 2rem;">Settings</h1>
            <button class="btn btn-secondary" id="backFromSettingsBtn">Back</button>
        </div>
        
        <div class="exercise-box mb-4">
            <h2 class="font-bold mb-4">Workout Categories</h2>
            <div id="categoryList"></div>
            <div style="border-top: 1px solid #e2e8f0; margin-top: 1rem; padding-top: 1rem;">
                <h3 class="font-bold mb-2">Add New Category</h3>
                <div class="mb-2">
                    <input type="text" id="newCategoryName" placeholder="Category name...">
                </div>
                <div class="mb-2">
                    <label class="text-sm">Color:</label>
                    <input type="color" id="newCategoryColor" value="#3b82f6" style="width: 100%; height: 3rem;">
                </div>
                <button class="btn btn-primary" id="addCategoryBtn" style="width: 100%;">Add Category</button>
            </div>
        </div>
        
        <div class="exercise-box mb-4">
            <h2 class="font-bold mb-4">Data Management</h2>
            <p class="text-sm text-gray mb-4">Import your old workout data or export for backup</p>
            <input type="file" id="importFile" accept=".json" style="display: none;">
            <button class="btn btn-secondary mb-2" id="importDataBtn" style="width: 100%;">Import Old Data</button>
            <button class="btn btn-secondary" id="exportDataBtn" style="width: 100%;">Export All Data</button>
        </div>
        
        <div class="exercise-box">
            <h2 class="font-bold mb-4">Account</h2>
            <p class="text-sm text-gray mb-4" id="userEmailDisplay"></p>
            <button class="btn btn-secondary" id="logoutBtn" style="width: 100%;">Log Out</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ── Global state ──────────────────────────────────────────────
        let supabaseClient;
        let currentUser = null;
        let workoutCategories = [];
        let currentWorkout = null;
        let exercises = [];
        let timerSeconds = 90;
        let timerInterval = null;
        let workoutStartTime = null;
        let workoutInfoTimeout = null;
        let viewingMonth = new Date().getMonth();
        let viewingYear = new Date().getFullYear();
        let customMetrics = [];
        let exercisePreferences = {};
        let exerciseLibrary = []; // { exercise_name, tags: [] }

        const DEFAULT_METRICS = ['reps', 'weight', 'time', 'distance', 'speed', 'incline'];

        // Standard muscle-group tags (used for library organization)
        const STANDARD_TAGS = ['Chest', 'Back', 'Shoulders', 'Biceps', 'Triceps', 'Legs', 'Core', 'Cardio'];

        // ── Init ──────────────────────────────────────────────────────
        async function init() {
            if (typeof window.supabase === 'undefined') {
                alert('Failed to load. Please refresh.');
                return;
            }

            const SUPABASE_URL = 'https://avuskoyuupiechsqjyrw.supabase.co';
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF2dXNrb3l1dXBpZWNoc3FqeXJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEwNTcyMDgsImV4cCI6MjA4NjYzMzIwOH0.rfzlvPcIkB_noPBNemiU-yNagzGwLaYgHob9gu_-0ck';
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            setupEventListeners();

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                await loadUserData();
                showHome();
            } else {
                showAuthScreen();
            }

        function setupEventListeners() {

        async function loadUserData() {
            showLoadingScreen();

            const { data: categories } = await supabaseClient
                .from('workout_categories')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at');

            if (categories && categories.length > 0) {
                workoutCategories = categories;
            } else {
                await createDefaultCategories();
            }

            const { data: metrics } = await supabaseClient
                .from('custom_metrics')
                .select('*')
                .eq('user_id', currentUser.id);
            if (metrics) customMetrics = metrics.map(m => m.metric_name);

            const { data: prefs } = await supabaseClient
                .from('exercise_preferences')
                .select('*')
                .eq('user_id', currentUser.id);
            if (prefs) {
                exercisePreferences = {};
                prefs.forEach(p => { exercisePreferences[p.exercise_name] = p.metrics; });
            }
        }

        async function createDefaultCategories() {
            const defaults = [
                { name: 'Chest', color: '#3b82f6' },
                { name: 'Back', color: '#10b981' },
                { name: 'Legs', color: '#0ea5e9' },
                { name: 'Shoulders', color: '#6366f1' },
                { name: 'Arms', color: '#8b5cf6' },
                { name: 'Cardio', color: '#06b6d4' }
            ];
            for (const cat of defaults) {
                const { data } = await supabaseClient
                    .from('workout_categories')
                    .insert({ user_id: currentUser.id, name: cat.name, color: cat.color })
                    .select().single();
                if (data) workoutCategories.push(data);
            }

        // ── Auth ──────────────────────────────────────────────────────
        function showLogin() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('signupForm').classList.add('hidden');
            clearAuthError();
        }
        function showSignup() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.remove('hidden');
            clearAuthError();
        }
        function showAuthError(msg) {
            const el = document.getElementById('authError');
            el.textContent = msg;
            el.classList.remove('hidden');
        }
        function clearAuthError() { document.getElementById('authError').classList.add('hidden'); }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) { showAuthError('Please enter email and password'); return; }
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) { showAuthError(error.message); }
            else { currentUser = data.user; await loadUserData(); showHome(); }
        }

        async function handleSignup() {
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const passwordConfirm = document.getElementById('signupPasswordConfirm').value;
            if (!email || !password) { showAuthError('Please enter email and password'); return; }
            if (password !== passwordConfirm) { showAuthError('Passwords do not match'); return; }
            if (password.length < 6) { showAuthError('Password must be at least 6 characters'); return; }
            const { error } = await supabaseClient.auth.signUp({ email, password });
            if (error) { showAuthError(error.message); }
            else { alert('Account created! Check your email to verify, then log in.'); showLogin(); }
        }

        async function handleGoogleSignIn() {
            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin }
            });
            if (error) showAuthError(error.message);
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            currentUser = null;
            workoutCategories = [];
            showAuthScreen();
        }

        // ── Start Workout ─────────────────────────────────────────────
        function startWorkout(category) {
            const draft = loadDraft();
            if (draft && draft.categoryId === category.id) {
                if (confirm('Resume your draft workout?')) {
                    currentWorkout = category;
                    exercises = draft.exercises;
                    workoutStartTime = new Date(draft.startTime);
                    document.getElementById('workoutDate').value = draft.date;
                    document.getElementById('workoutTime').value = draft.time;
                    document.getElementById('workoutNotes').value = draft.notes || '';
                    document.getElementById('workoutColorDot').style.background = category.color;
                    document.getElementById('workoutTitle').textContent = category.name;
                    updateWorkoutInfo();
                    renderPreviousWorkouts();
                    renderExercises();
                    showWorkoutScreen();
                    setupExerciseAutocomplete();
                    return;
                }
            }

            currentWorkout = category;
            exercises = [];
            workoutStartTime = new Date();
            const now = new Date();
            document.getElementById('workoutDate').value = now.toISOString().split('T')[0];
            document.getElementById('workoutTime').value = now.toTimeString().slice(0, 5);
            document.getElementById('workoutNotes').value = '';
            document.getElementById('workoutColorDot').style.background = category.color;
            document.getElementById('workoutTitle').textContent = category.name;
            updateWorkoutInfo();
            renderPreviousWorkouts();
            renderExercises();
            showWorkoutScreen();
            setupExerciseAutocomplete();
            saveDraft();
        }

        function updateWorkoutDateTime() {
            const dateStr = document.getElementById('workoutDate').value;
            const timeStr = document.getElementById('workoutTime').value;
            if (dateStr && timeStr) { workoutStartTime = new Date(`${dateStr}T${timeStr}`); updateWorkoutInfo(); }
        }

        function updateWorkoutInfo() {
            if (workoutInfoTimeout) { clearTimeout(workoutInfoTimeout); workoutInfoTimeout = null; }
            const now = new Date();
            const timeDiff = now - workoutStartTime;
            const hoursDiff = timeDiff / (1000 * 60 * 60);
            const isRecent = hoursDiff >= 0 && hoursDiff < 6;
            if (isRecent) {
                const duration = Math.floor(timeDiff / 60000);
                document.getElementById('workoutInfo').textContent =
                    `${workoutStartTime.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })} • ${duration} min`;
                workoutInfoTimeout = setTimeout(updateWorkoutInfo, 30000);
            } else {
                document.getElementById('workoutInfo').textContent =
                    `${workoutStartTime.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} at ${workoutStartTime.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}`;
            }
        }

            const boxDiv = container.querySelector('.exercise-box');

            workouts.forEach(workout => {
                const start = new Date(workout.start_time);
                const end = new Date(workout.end_time);
                const duration = Math.floor((end - start) / 60000);
                const workoutDiv = document.createElement('div');
                workoutDiv.style.cssText = 'border: 1px solid rgba(0, 245, 255, 0.2); padding: 0.75rem; margin-top: 0.75rem; border-radius: 0.5rem; background: rgba(255, 255, 255, 0.05);';

                    </div>

                        ${workout.exercises.map(ex => {
                            if (currentWorkout.name === 'Cardio') {
                                const details = ex.sets.map(s => {
                                    const parts = [];
                                    if (s.time) parts.push(`${s.time} min`);
                                    if (s.distance) parts.push(`${s.distance} mi`);
                                    if (s.speed) parts.push(`${s.speed} mph`);
                                    if (s.incline) parts.push(`${s.incline}% incline`);
                                    return parts.join(', ');

        // ── Exercise Management ───────────────────────────────────────
        const exerciseHistoryCache = {}; // name -> array of past sessions

        function addCustomExercise() {
            const input = document.getElementById('customExercise');
            if (input.value.trim()) { addExercise(input.value.trim()); input.value = ''; }
        }

        async function addExercise(name) {
            const categoryKey = `categoryMetrics_${currentWorkout.name}`;
            const savedCategoryMetrics = localStorage.getItem(categoryKey);
            let defaultMetrics = ['reps', 'weight'];
            if (currentWorkout.name === 'Cardio') defaultMetrics = ['time', 'distance', 'speed', 'incline'];
            else if (savedCategoryMetrics) defaultMetrics = JSON.parse(savedCategoryMetrics);

            const savedMetrics = exercisePreferences[name] || defaultMetrics;
            const exercise = {
                id: Date.now(),
                name,
                metrics: savedMetrics,
                sets: [createEmptySet(savedMetrics)],
                notes: '',
                tags: [],
                history: null // will be populated async
            };
            exercises.push(exercise);
            renderExercises();
            saveDraft();

            // Fetch history in background and update inline
            fetchExerciseHistory(exercise.id, name);
        }

        async function fetchExerciseHistory(exerciseId, exerciseName) {
            // Use cache if available
            if (exerciseHistoryCache[exerciseName]) {
                injectHistoryIntoExercise(exerciseId, exerciseHistoryCache[exerciseName]);
                return;
            }

            const { data } = await supabaseClient
                .from('exercises')
                .select('name, notes, workouts!inner(start_time), sets(*)')
                .eq('name', exerciseName)
                .eq('workouts.user_id', currentUser.id)
                .order('workouts(start_time)', { ascending: false })
                .limit(3);

            const history = data || [];
            exerciseHistoryCache[exerciseName] = history;
            injectHistoryIntoExercise(exerciseId, history);

            // Also update the exercise object for draft saving
            const exercise = exercises.find(ex => ex.id === exerciseId);
            if (exercise) exercise.history = history;
        }

        function injectHistoryIntoExercise(exerciseId, history) {
            const container = document.getElementById(`exercise-history-inline-${exerciseId}`);
            if (!container) return;

            if (!history || history.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray" style="padding: 0.5rem 0;">No previous history for this exercise</p>';
                return;
            }

            container.innerHTML = history.map((session, idx) => {
                const date = new Date(session.workouts.start_time);
                const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

                const setLines = session.sets.map((s, si) => {
                    const parts = [];
                    if (s.reps && s.weight) parts.push(`${s.reps} × ${s.weight} lbs`);
                    else if (s.reps) parts.push(`${s.reps} reps`);
                    else if (s.weight) parts.push(`${s.weight} lbs`);
                    if (s.time) parts.push(`${s.time} min`);
                    if (s.distance) parts.push(`${s.distance} mi`);
                    if (s.speed) parts.push(`${s.speed} mph`);
                    if (s.incline) parts.push(`${s.incline}% incline`);
                    return parts.length ? `<div class="text-xs text-gray" style="padding-left: 0.5rem;">Set ${si + 1}: ${parts.join(' · ')}</div>` : '';
                }).filter(Boolean).join('');

                const notesHTML = session.notes
                    ? `<div class="text-xs" style="color: rgba(0,245,255,0.6); font-style: italic; margin-top: 0.25rem; padding-left: 0.5rem;">"${session.notes}"</div>`
                    : '';

                const isLast = idx === history.length - 1;
                return `
                    <div style="${!isLast ? 'border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 0.5rem; margin-bottom: 0.5rem;' : ''}">
                        <div class="text-xs font-bold" style="color: rgba(0,245,255,0.8); margin-bottom: 0.25rem;">${dateStr}</div>
                        ${setLines}
                        ${notesHTML}
                    </div>`;
            }).join('');
        }

        function createEmptySet(metrics) {
            const set = {};
            metrics.forEach(m => { set[m] = ''; });
            return set;
        }

        window.toggleInlineHistory = function(exerciseId) {
            const panel = document.getElementById(`exercise-history-inline-${exerciseId}`);
            const arrow = document.getElementById(`inline-history-arrow-${exerciseId}`);
            if (!panel) return;
            const isHidden = panel.style.display === 'none';
            panel.style.display = isHidden ? 'block' : 'none';
            if (arrow) arrow.textContent = isHidden ? '▼' : '▶';
            if (isHidden) {
                const exercise = exercises.find(ex => ex.id === exerciseId);
                if (exercise) fetchExerciseHistory(exerciseId, exercise.name);
            }
        };

        // ── Dropdown positioning helper (fixes clipping) ──────────────
        // Positions a dropdown as fixed, anchored below a button
        function positionDropdown(dropdown, anchorEl, opts = {}) {
            const rect = anchorEl.getBoundingClientRect();
            const winH = window.innerHeight;
            const winW = window.innerWidth;

            const dropH = opts.maxHeight || 320;
            const dropW = opts.width || 280;

            // Decide if it opens below or above
            const spaceBelow = winH - rect.bottom;
            const openAbove = spaceBelow < dropH + 16 && rect.top > dropH + 16;

            const isMobile = winW < 600;
            const finalW = isMobile ? Math.min(winW - 16, opts.width || 320) : Math.min(dropW, winW - 24);

            dropdown.style.width = finalW + 'px';
            dropdown.style.maxHeight = Math.min(dropH, openAbove ? rect.top - 16 : spaceBelow - 16) + 'px';
            dropdown.style.overflowY = 'auto';
            dropdown.style.right = 'auto';

            // Right-align to button edge if left-align would overflow screen
            const leftAligned = rect.left;
            const rightAligned = rect.right - finalW;
            const bestLeft = (leftAligned + finalW > winW - 8) ? rightAligned : leftAligned;
            dropdown.style.left = Math.max(8, bestLeft) + 'px';

            if (openAbove) {
                dropdown.style.bottom = (winH - rect.top + 4) + 'px';
                dropdown.style.top = 'auto';
            } else {
                dropdown.style.top = (rect.bottom + 4) + 'px';
                dropdown.style.bottom = 'auto';
            }
        }

        // ── Exercise autocomplete & Library ───────────────────────────
        async function setupExerciseAutocomplete() {
            const input = document.getElementById('customExercise');
            const autocompleteDropdown = document.getElementById('exerciseAutocomplete');
            const libraryBtn = document.getElementById('libraryBtn');
            const libraryDropdown = document.getElementById('libraryDropdown');

            if (!input || !autocompleteDropdown || !libraryBtn || !libraryDropdown) return;

            // Load exercise history + tags from past workouts
            const { data: workoutsData } = await supabaseClient
                .from('workouts')
                .select('exercises(name, notes)')
                .eq('user_id', currentUser.id);

            // Also load exercise_preferences to get stored tags if any
            const { data: prefsData } = await supabaseClient
                .from('exercise_preferences')
                .select('exercise_name, metrics')
                .eq('user_id', currentUser.id);

            // Build a map of exercise_name -> tags from exercises' stored tags in drafts
            // We'll also look at exercise tags stored in sets/exercises table if available
            // For now, pull tag data from the local exercises array (current session) + localStorage
            const exerciseTagMap = {};

            // Try to load saved exercise tags from localStorage
            try {
                const savedTags = JSON.parse(localStorage.getItem('exerciseTags') || '{}');
                Object.assign(exerciseTagMap, savedTags);
            } catch(e) {}

            const exerciseSet = new Set();
            if (workoutsData) {
                workoutsData.forEach(w => {
                    if (w.exercises) {
                        w.exercises.forEach(ex => {
                            if (ex.name) exerciseSet.add(ex.name);
                        });
                    }
                });
            }

            exerciseLibrary = Array.from(exerciseSet).map(name => ({
                exercise_name: name,
                tags: exerciseTagMap[name] || []
            }));

            // Re-clone elements to clear old listeners
            const newInput = input.cloneNode(true);
            input.parentNode.replaceChild(newInput, input);
            const finalInput = document.getElementById('customExercise');

            const newLibraryBtn = libraryBtn.cloneNode(true);
            libraryBtn.parentNode.replaceChild(newLibraryBtn, libraryBtn);
            const finalLibraryBtn = document.getElementById('libraryBtn');

            // Move autocomplete to body so it's never clipped by any parent
            if (autocompleteDropdown.parentElement !== document.body) {
                document.body.appendChild(autocompleteDropdown);
            }
            // Move library dropdown to body too
            if (libraryDropdown.parentElement !== document.body) {
                document.body.appendChild(libraryDropdown);
            }

            const showAutocomplete = (inputEl) => {
                const value = inputEl.value.trim().toLowerCase();
                if (!value) { autocompleteDropdown.classList.add('hidden'); return; }

                const matches = exerciseLibrary
                    .filter(ex => ex.exercise_name.toLowerCase().includes(value))
                    .slice(0, 8);

                if (matches.length > 0) {
                    autocompleteDropdown.innerHTML = matches.map(ex => `
                        <div style="padding: 0.75rem; cursor: pointer; border-bottom: 1px solid rgba(255, 255, 255, 0.05);"
                             onmouseover="this.style.background='rgba(0, 245, 255, 0.1)'"
                             onmouseout="this.style.background='transparent'"
                             onclick="selectExerciseFromLibrary('${ex.exercise_name.replace(/'/g, "\\'")}')">
                            <div class="text-sm font-bold">${ex.exercise_name}</div>
                            ${ex.tags && ex.tags.length ? `<div class="text-xs text-gray">${ex.tags.join(' · ')}</div>` : ''}
                        </div>`).join('');
                    autocompleteDropdown.classList.remove('hidden');
                    // Use full input width, anchored to the input element
                    positionDropdown(autocompleteDropdown, inputEl, { width: inputEl.getBoundingClientRect().width, maxHeight: 250 });
                } else {
                    autocompleteDropdown.classList.add('hidden');
                }
            };

            // Autocomplete on input
            finalInput.addEventListener('input', function() { showAutocomplete(this); });

            // Reposition on scroll so it tracks the input
            window.addEventListener('scroll', () => {
                if (!autocompleteDropdown.classList.contains('hidden')) {
                    positionDropdown(autocompleteDropdown, finalInput, { width: finalInput.getBoundingClientRect().width, maxHeight: 250 });
                }
            }, { passive: true });

            // Library button
            finalLibraryBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                const isHidden = libraryDropdown.classList.contains('hidden');
                autocompleteDropdown.classList.add('hidden');

                if (isHidden) {
                    renderLibraryDropdown();
                    libraryDropdown.classList.remove('hidden');
                    positionDropdown(libraryDropdown, finalLibraryBtn, { width: 320, maxHeight: 400 });
                } else {
                    libraryDropdown.classList.add('hidden');
                }
            });

            // Close on outside click
            document.addEventListener('click', function closeDropdowns(e) {
                if (!finalInput.contains(e.target) && !autocompleteDropdown.contains(e.target)) {
                    autocompleteDropdown.classList.add('hidden');
                }
                if (!finalLibraryBtn.contains(e.target) && !libraryDropdown.contains(e.target)) {
                    libraryDropdown.classList.add('hidden');
                }
            });
        }

        // ── Render Library organised by muscle group tags ─────────────
        function renderLibraryDropdown() {
            const libraryDropdown = document.getElementById('libraryDropdown');

            if (exerciseLibrary.length === 0) {
                libraryDropdown.innerHTML = `<p class="text-xs text-gray" style="padding: 1rem;">No exercises yet. Add some workouts first!</p>`;
                return;
            }

            // Group exercises by tag
            const tagGroups = {};  // tag -> [exercise_name]
            const untagged = [];

            exerciseLibrary.forEach(ex => {
                if (!ex.tags || ex.tags.length === 0) {
                    untagged.push(ex.exercise_name);
                } else {
                    ex.tags.forEach(tag => {
                        if (!tagGroups[tag]) tagGroups[tag] = [];
                        tagGroups[tag].push(ex.exercise_name);
                    });
                }
            });

            // Build ordered tag list: standard tags first, then custom
            const orderedTags = [
                ...STANDARD_TAGS.filter(t => tagGroups[t]),
                ...Object.keys(tagGroups).filter(t => !STANDARD_TAGS.includes(t)).sort()
            ];

            let html = '';

            // Tagged groups
            orderedTags.forEach(tag => {
                const exNames = [...new Set(tagGroups[tag])].sort();
                const groupId = `lib-group-${tag.replace(/\s+/g, '-')}`;
                html += `
                    <div class="library-tag-group">
                        <div class="library-tag-header" onclick="toggleLibraryGroup('${groupId}')">
                            <span>${tag}</span>
                            <span id="${groupId}-arrow">▼</span>
                        </div>
                        <div id="${groupId}" class="library-tag-exercises">
                            ${exNames.map(name => `
                                <div class="library-exercise-item" onclick="selectExerciseFromLibrary('${name.replace(/'/g, "\\'")}')">
                                    ${name}
                                </div>`).join('')}
                        </div>
                    </div>`;
            });

            // Untagged / All section
            if (untagged.length > 0) {
                const sorted = [...new Set(untagged)].sort();
                const groupId = 'lib-group-untagged';
                html += `
                    <div class="library-tag-group">
                        <div class="library-tag-header" onclick="toggleLibraryGroup('${groupId}')" style="color: rgba(224, 224, 224, 0.5);">
                            <span>Untagged</span>
                            <span id="${groupId}-arrow">▼</span>
                        </div>
                        <div id="${groupId}" class="library-tag-exercises">
                            ${sorted.map(name => `
                                <div class="library-exercise-item" onclick="selectExerciseFromLibrary('${name.replace(/'/g, "\\'")}')">
                                    ${name}
                                </div>`).join('')}
                        </div>
                    </div>`;
            }

            libraryDropdown.innerHTML = html;
        }

        window.toggleLibraryGroup = function(groupId) {
            const group = document.getElementById(groupId);
            const arrow = document.getElementById(`${groupId}-arrow`);
            if (!group) return;
            const isHidden = group.classList.contains('hidden');
            group.classList.toggle('hidden');
            if (arrow) arrow.textContent = isHidden ? '▼' : '▶';
        };

        window.selectExerciseFromLibrary = function(exerciseName) {
            const input = document.getElementById('customExercise');
            const autocompleteDropdown = document.getElementById('exerciseAutocomplete');
            const libraryDropdown = document.getElementById('libraryDropdown');
            addExercise(exerciseName);
            if (input) input.value = '';
            autocompleteDropdown.classList.add('hidden');
            libraryDropdown.classList.add('hidden');
        };

        // ── Per-exercise dropdowns (metrics & tags) via fixed portal ──
        let activePortal = null;

        function closePortal() {
            if (activePortal) {
                activePortal.remove();
                activePortal = null;
            }
        }

        function createPortalDropdown(content, anchorBtn, opts = {}) {
            closePortal();
            const portal = document.createElement('div');
            portal.className = 'exercise-dropdown-portal';
            portal.innerHTML = content;
            document.body.appendChild(portal);
            activePortal = portal;
            positionDropdown(portal, anchorBtn, { width: opts.width || 240, maxHeight: opts.maxHeight || 300 });
            return portal;
        }

        document.addEventListener('click', function(e) {
            if (activePortal && !activePortal.contains(e.target) && !e.target.closest('[data-portal-trigger]')) {
                closePortal();
            }
            // Close library/autocomplete if clicking elsewhere
            const lib = document.getElementById('libraryDropdown');
            const auto = document.getElementById('exerciseAutocomplete');
            if (lib && !lib.contains(e.target) && !e.target.closest('#libraryBtn')) lib.classList.add('hidden');
            if (auto && !auto.contains(e.target) && !e.target.closest('#customExercise')) auto.classList.add('hidden');
        });

        window.showMetricsEditor = function(exerciseId, anchorBtn) {
            const exercise = exercises.find(ex => ex.id === exerciseId);
            if (!exercise) return;

            const buildContent = () => {
                const defaultMetricsHTML = DEFAULT_METRICS.map(metric => {
                    const isSelected = exercise.metrics.includes(metric);
                    const label = metric.charAt(0).toUpperCase() + metric.slice(1);
                    return `<div onclick="toggleMetricPortal(${exerciseId}, '${metric}')" 
                                 style="padding: 0.5rem; border-radius: 0.375rem; cursor: pointer; font-size: 0.875rem; margin-bottom: 0.25rem; ${isSelected ? 'background: rgba(0, 245, 255, 0.2); border: 1px solid rgba(0, 245, 255, 0.5); color: #00f5ff;' : 'background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: rgba(224, 224, 224, 0.8);'}">
                                ${label}
                            </div>`;
                }).join('');

                const customMetricsHTML = customMetrics.map(metric => {
                    const isSelected = exercise.metrics.includes(metric);

                                <div onclick="toggleMetricPortal(${exerciseId}, '${metric}')" style="flex: 1; padding: 0.5rem; border-radius: 0.375rem; cursor: pointer; font-size: 0.875rem; ${isSelected ? 'background: rgba(0, 245, 255, 0.2); border: 1px solid rgba(0, 245, 255, 0.5); color: #00f5ff;' : 'background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: rgba(224, 224, 224, 0.8);'}">${label}</div>
                                <button onclick="event.stopPropagation(); deleteCustomMetric('${metric}', ${exerciseId})" style="background: rgba(239, 68, 68, 0.2); color: #ef4444; border: none; border-radius: 0.25rem; padding: 0.25rem 0.5rem; font-size: 0.75rem; cursor: pointer;">×</button>
