<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=DM+Sans:wght@500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: white;
            color: #0f172a;
            line-height: 1.5;
        }
        
        .container {
            max-width: 56rem;
            margin: 0 auto;
            padding: 1.5rem;
        }
        
        .title-text {
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            font-size: 1rem;
        }
        
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        
        .btn-primary:hover {
            background: #2563eb;
        }
        
        .btn-secondary {
            background: #f1f5f9;
            color: #0f172a;
        }
        
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        
        input, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }
        
        .hidden {
            display: none !important;
        }
        
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .auth-box {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
        }
        
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mt-4 { margin-top: 1rem; }
        
        .text-center { text-align: center; }
        .text-sm { font-size: 0.875rem; }
        .text-gray { color: #64748b; }
        
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
        }
        
        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Auth Screen -->
    <div id="authScreen" class="auth-container">
        <div class="auth-box">
            <h1 class="title-text text-center mb-4" style="font-size: 2rem; color: #667eea;">Workout Tracker</h1>
            
            <div id="authError" class="error hidden"></div>
            
            <div id="loginForm">
                <div class="mb-4">
                    <label class="text-sm font-bold mb-2" style="display: block;">Email</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com">
                </div>
                
                <div class="mb-4">
                    <label class="text-sm font-bold mb-2" style="display: block;">Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••">
                </div>
                
                <button class="btn btn-primary" style="width: 100%;" id="loginBtn">Log In</button>
                
                <p class="text-center text-sm text-gray mt-4">
                    Don't have an account? <a href="#" id="showSignupLink" style="color: #3b82f6;">Sign up</a>
                </p>
            </div>
            
            <div id="signupForm" class="hidden">
                <div class="mb-4">
                    <label class="text-sm font-bold mb-2" style="display: block;">Email</label>
                    <input type="email" id="signupEmail" placeholder="your@email.com">
                </div>
                
                <div class="mb-4">
                    <label class="text-sm font-bold mb-2" style="display: block;">Password</label>
                    <input type="password" id="signupPassword" placeholder="••••••••">
                </div>
                
                <div class="mb-4">
                    <label class="text-sm font-bold mb-2" style="display: block;">Confirm Password</label>
                    <input type="password" id="signupPasswordConfirm" placeholder="••••••••">
                </div>
                
                <button class="btn btn-primary" style="width: 100%;" id="signupBtn">Sign Up</button>
                
                <p class="text-center text-sm text-gray mt-4">
                    Already have an account? <a href="#" id="showLoginLink" style="color: #3b82f6;">Log in</a>
                </p>
            </div>
        </div>
    </div>
    
    <!-- Loading Screen -->
    <div id="loadingScreen" class="hidden">
        <div class="loading">
            <div class="spinner"></div>
            <p class="text-gray mt-4">Loading your workouts...</p>
        </div>
    </div>
    
    <!-- Main App (placeholder for now) -->
    <div id="mainApp" class="hidden container">
        <h1 class="title-text">Welcome to Workout Tracker!</h1>
        <p class="text-gray mt-4" id="userEmail"></p>
        <button class="btn btn-secondary mt-4" id="logoutBtn">Log Out</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Global variables
        let supabase;
        let currentUser = null;
        
        // Initialize on load
        async function init() {
            console.log('Initializing app...');
            
            // Check if Supabase loaded
            if (typeof window.supabase === 'undefined') {
                alert('Failed to load. Please refresh the page.');
                return;
            }
            
            // Initialize Supabase
            const SUPABASE_URL = 'https://avuskoyuupiechsqjyrw.supabase.co';
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF2dXNrb3l1dXBpZWNoc3FqeXJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEwNTcyMDgsImV4cCI6MjA4NjYzMzIwOH0.rfzlvPcIkB_noPBNemiU-yNagzGwLaYgHob9gu_-0ck';
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            
            console.log('Supabase initialized');
            
            // Set up event listeners
            document.getElementById('loginBtn').addEventListener('click', handleLogin);
            document.getElementById('signupBtn').addEventListener('click', handleSignup);
            document.getElementById('logoutBtn').addEventListener('click', handleLogout);
            document.getElementById('showSignupLink').addEventListener('click', function(e) {
                e.preventDefault();
                showSignup();
            });
            document.getElementById('showLoginLink').addEventListener('click', function(e) {
                e.preventDefault();
                showLogin();
            });
            
            // Check if user is already logged in
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session) {
                currentUser = session.user;
                showMainApp();
            } else {
                showAuthScreen();
            }
        }
        
        // Auth functions
        function showLogin() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('signupForm').classList.add('hidden');
            clearAuthError();
        }
        
        function showSignup() {
            console.log('showSignup called');
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.remove('hidden');
            clearAuthError();
        }
        
        function showAuthError(message) {
            const errorEl = document.getElementById('authError');
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
        }
        
        function clearAuthError() {
            document.getElementById('authError').classList.add('hidden');
        }
        
        async function handleLogin() {
            console.log('handleLogin called');
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showAuthError('Please enter email and password');
                return;
            }
            
            const { data, error } = await supabase.auth.signInWithPassword({
                email,
                password
            });
            
            if (error) {
                showAuthError(error.message);
            } else {
                currentUser = data.user;
                showMainApp();
            }
        }
        
        async function handleSignup() {
            console.log('handleSignup called');
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const passwordConfirm = document.getElementById('signupPasswordConfirm').value;
            
            console.log('Email:', email);
            
            if (!email || !password) {
                showAuthError('Please enter email and password');
                return;
            }
            
            if (password !== passwordConfirm) {
                showAuthError('Passwords do not match');
                return;
            }
            
            if (password.length < 6) {
                showAuthError('Password must be at least 6 characters');
                return;
            }
            
            console.log('Attempting signup...');
            
            const { data, error } = await supabase.auth.signUp({
                email,
                password
            });
            
            console.log('Signup result:', { data, error });
            
            if (error) {
                showAuthError(error.message);
            } else {
                alert('Account created! Please check your email to verify your account, then log in.');
                showLogin();
            }
        }
        
        async function handleLogout() {
            await supabase.auth.signOut();
            currentUser = null;
            showAuthScreen();
        }
        
        // Screen management
        function showAuthScreen() {
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.add('hidden');
        }
        
        function showLoadingScreen() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('loadingScreen').classList.remove('hidden');
            document.getElementById('mainApp').classList.add('hidden');
        }
        
        function showMainApp() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('userEmail').textContent = `Logged in as: ${currentUser.email}`;
        }
        
        // Start the app when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
