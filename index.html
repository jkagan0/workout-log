<!DOCTYPE html>
<html>
<head>
    <title>Test</title>
</head>
<body>
    <h1>Button Test</h1>
    <button onclick="alert('Button works!')">Click Me</button>
    
    <br><br>
    
    <input type="text" id="testInput" placeholder="Type something">
    <button onclick="testFunction()">Test Add</button>
    
    <div id="output"></div>
    
    <script>
        function testFunction() {
            alert('Function called!');
            const input = document.getElementById('testInput');
            const output = document.getElementById('output');
            output.innerHTML += '<p>' + input.value + '</p>';
            input.value = '';
        }
    </script>
</body>
</html>
